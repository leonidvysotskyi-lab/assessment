<!doctype html>
<html lang="de">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
    <meta name="theme-color" content="#173f47">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="manifest"
        href="data:application/manifest+json,%7B%22name%22%3A%22Assessment%22%2C%22short_name%22%3A%22Assessment%22%2C%22display%22%3A%22standalone%22%2C%22start_url%22%3A%22.%22%2C%22theme_color%22%3A%22%23173f47%22%2C%22background_color%22%3A%22%23f6f2e9%22%7D">
    <title>Assessment</title>
    <style>
        :root {
            --ink: #173f47;
            --ink-2: #285c60;
            --coral: #d9684d;
            --gold: #edb84b;
            --paper: #f6f2e9;
            --white: #fffdf8;
            --line: #d6d0c3;
            --muted: #667477;
            --danger: #9c302a;
            --shadow: 0 10px 30px #173f4714
        }

        * {
            box-sizing: border-box
        }

        html {
            scroll-behavior: smooth
        }

        body {
            margin: 0;
            background: var(--paper);
            color: var(--ink);
            font-family: Georgia, 'Times New Roman', serif;
            font-size: 17px;
            line-height: 1.45
        }

        button,
        input,
        textarea,
        select {
            font: inherit;
            font-size: 16px
        }

        button {
            cursor: pointer
        }

        button:focus-visible,
        input:focus-visible,
        textarea:focus-visible {
            outline: 3px solid var(--gold);
            outline-offset: 2px
        }

        .app-shell {
            min-height: 100vh
        }

        .topbar {
            position: sticky;
            top: 0;
            z-index: 10;
            background: var(--ink);
            color: #fffdf8;
            padding: 14px max(18px, calc((100% - 1080px)/2));
            box-shadow: 0 3px 15px #173f4733
        }

        .topbar-inner {
            display: flex;
            align-items: center;
            gap: 18px;
            max-width: 1080px;
            margin: auto
        }

        .brand {
            font-size: 23px;
            font-weight: bold;
            letter-spacing: .02em
        }

        .topbar .brand {
            flex: 1
        }

        .content {
            max-width: 900px;
            margin: 0 auto;
            padding: 42px 18px 80px
        }

        .kicker {
            color: var(--coral);
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: .1em;
            font-size: 12px
        }

        .page-title {
            font-size: clamp(34px, 6vw, 60px);
            line-height: 1.02;
            margin: 8px 0 28px;
            max-width: 600px
        }

        .intro {
            color: var(--muted);
            max-width: 600px
        }

        .button {
            min-height: 46px;
            border: 1px solid transparent;
            border-radius: 5px;
            padding: 10px 17px;
            background: var(--coral);
            color: white;
            font-weight: bold;
            touch-action: manipulation
        }

        .button.secondary {
            background: transparent;
            border-color: var(--ink);
            color: var(--ink)
        }

        .button.ghost {
            background: transparent;
            color: inherit;
            border-color: currentColor
        }

        .button.danger {
            background: var(--danger)
        }

        .toolbar {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            align-items: center;
            margin: 24px 0
        }

        .assessment-list {
            display: grid;
            gap: 10px;
            margin-top: 22px
        }

        .assessment-row {
            background: var(--white);
            border: 1px solid var(--line);
            box-shadow: var(--shadow);
            display: flex;
            align-items: stretch;
            min-height: 86px
        }

        .row-open {
            flex: 1;
            border: 0;
            background: transparent;
            text-align: left;
            padding: 15px 17px;
            color: var(--ink);
            min-width: 0
        }

        .row-name {
            font-weight: bold;
            font-size: 20px;
            display: block;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis
        }

        .row-meta {
            color: var(--muted);
            font-size: 14px
        }

        .row-menu {
            position: relative;
            display: flex;
            align-items: center;
            border-left: 1px solid var(--line);
            padding: 8px
        }

        .icon-button {
            border: 0;
            background: transparent;
            color: inherit;
            min-width: 44px;
            min-height: 44px;
            border-radius: 50%;
            font-size: 24px
        }

        .icon-button:hover {
            background: #173f4710
        }

        .menu {
            position: absolute;
            right: 8px;
            top: 58px;
            z-index: 3;
            background: var(--white);
            border: 1px solid var(--line);
            box-shadow: var(--shadow);
            min-width: 170px;
            padding: 6px
        }

        .menu button {
            display: block;
            width: 100%;
            text-align: left;
            border: 0;
            background: transparent;
            padding: 11px 12px;
            min-height: 44px;
            color: var(--ink)
        }

        .menu button:hover {
            background: #edb84b33
        }

        .empty {
            border: 1px dashed var(--line);
            padding: 28px;
            color: var(--muted);
            background: #fffdf866
        }

        .search {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid var(--line);
            background: var(--white);
            border-radius: 4px
        }

        .search-wrap {
            max-width: 420px
        }

        .footer-tools {
            border-top: 1px solid var(--line);
            margin-top: 55px;
            padding-top: 20px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap
        }

        .storage-line {
            color: var(--muted);
            font-size: 13px;
            margin-top: 15px
        }

        .banner {
            position: fixed;
            z-index: 30;
            left: 16px;
            right: 16px;
            bottom: 16px;
            background: var(--danger);
            color: white;
            padding: 15px 48px 15px 16px;
            box-shadow: var(--shadow);
            font-weight: bold
        }

        .banner button {
            position: absolute;
            right: 6px;
            top: 6px;
            color: white
        }

        .dialog-backdrop {
            position: fixed;
            inset: 0;
            z-index: 20;
            background: #173f4770;
            display: grid;
            place-items: center;
            padding: 18px
        }

        .dialog {
            background: var(--white);
            width: min(520px, 100%);
            max-height: 92vh;
            overflow: auto;
            padding: 25px;
            box-shadow: var(--shadow);
            border-top: 7px solid var(--coral)
        }

        .dialog h2 {
            margin-top: 0
        }

        .field {
            display: grid;
            gap: 6px;
            margin: 15px 0
        }

        .field label {
            font-weight: bold
        }

        .field input,
        .field textarea,
        .field select {
            width: 100%;
            padding: 11px 12px;
            background: #fff;
            border: 1px solid var(--line);
            border-radius: 4px
        }

        .field textarea {
            resize: none;
            overflow: hidden;
            min-height: 76px
        }

        .segmented {
            display: flex;
            gap: 0
        }

        .segmented label {
            flex: 1
        }

        .segmented input,
        .choice input,
        .check input {
            position: absolute;
            opacity: 0
        }

        .segmented span {
            display: block;
            text-align: center;
            border: 1px solid var(--line);
            padding: 10px
        }

        .segmented label:first-child span {
            border-radius: 4px 0 0 4px
        }

        .segmented label:last-child span {
            border-radius: 0 4px 4px 0
        }

        .segmented input:checked+span {
            background: var(--ink);
            color: white
        }

        .dialog-actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 22px
        }

        .form-top {
            display: flex;
            gap: 12px;
            align-items: center;
            flex-wrap: wrap
        }

        .candidate {
            flex: 1;
            min-width: 220px
        }

        .candidate strong {
            font-size: 20px;
            display: block
        }

        .save-status {
            color: #d6efdb;
            font-size: 13px;
            white-space: nowrap
        }

        .save-status.error {
            color: #ffaaa0
        }

        .jumpbar {
            position: sticky;
            top: 68px;
            z-index: 8;
            background: var(--paper);
            border-bottom: 1px solid var(--line);
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding: 10px max(18px, calc((100% - 1080px)/2));
            scrollbar-width: none
        }

        .jumpbar button {
            white-space: nowrap;
            border: 1px solid var(--line);
            background: var(--white);
            border-radius: 18px;
            padding: 8px 13px;
            min-height: 44px;
            color: var(--ink)
        }

        .jumpbar button.active {
            background: var(--ink);
            color: white;
            border-color: var(--ink)
        }

        .form-content {
        .rating.selected{background:transparent;color:#252525;box-shadow:none;text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:5px;filter:grayscale(1) contrast(1.25)}
        }

        .section {
            scroll-margin-top: 130px;
            margin: 0 0 25px;
            background: var(--white);
            border: 1px solid var(--line);
            box-shadow: var(--shadow);
            padding: 20px
        }

        .section.fazit {
            margin-top: 58px;
            border: 3px solid var(--ink)
        }

        .section summary {
            cursor: pointer;
            list-style: none;
            font-size: 24px;
            font-weight: bold;
            margin: -2px 0 17px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            min-height: 44px
        }

        .section summary::-webkit-details-marker {
            display: none
        }

        .section summary:after {
            content: '+';
            font-size: 28px;
            font-weight: normal
        }

        .section[open] summary:after {
            content: '−'
        }

        .section-grid {
            display: grid;
            grid-template-columns: minmax(0, 1fr) minmax(220px, .75fr);
            gap: 20px
        }

        .rating-row {
            display: grid;
            grid-template-columns: minmax(145px, 1fr) auto;
            align-items: center;
            gap: 10px;
            border-bottom: 1px solid #d6d0c366;
            padding: 10px 0
        }

        .rating-row:last-child {
            border-bottom: 0
        }

        .rating-label {
            font-weight: bold
        }

        .ratings {
            display: flex;
            gap: 4px
        }

        .rating {
            width: 52px;
            height: 52px;
            border: 2px solid var(--line);
            background: #fff;
            border-radius: 5px;
            font-size: 27px;
            line-height: 1;
            touch-action: manipulation
        }

        .rating.selected {
            border-color: var(--ink);
            background: var(--gold);
            box-shadow: inset 0 0 0 3px var(--white)
        }

        .comment-label {
            font-weight: bold;
            display: block;
            margin-bottom: 6px
        }

        .choices {
            display: flex;
            flex-wrap: wrap;
            gap: 8px
        }

        .choice,
        .check {
            position: relative;
            display: flex;
            align-items: center;
            gap: 8px;
            min-height: 44px;
            padding: 7px 11px;
            border: 1px solid var(--line);
            background: #fff
        }

        .choice.checked,
        .check.checked {
            border-color: var(--ink);
            background: #e3eeea;
            font-weight: bold
        }

        .choice span:first-of-type,
        .check span:first-of-type {
            font-size: 21px
        }

        .two-col {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px 24px
        }

        .role-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px 30px
        }

        .role-grid .check {
            width: 100%
        }

        .curve-wrap {
            overflow-x: auto
        }

        .curve {
            min-width: 600px;
            width: 100%;
            border-collapse: collapse;
            table-layout: fixed
        }

        .curve th,
        .curve td {
            border: 1px solid var(--line);
            text-align: center;
            padding: 5px
        }

        .curve th {
            background: #e3eeea;
            font-size: 14px
        }

        .curve td {
            height: 58px
        }

        .curve button {
            width: 100%;
            height: 48px;
            border: 0;
            background: transparent;
            font-size: 26px;
            color: var(--ink)
        }

        .curve button.selected:after {
            content: '✕';
            font-weight: bold
        }

        .muted {
            color: var(--muted)
        }

        .help p {
            max-width: 650px
        }

        .print-only {
            display: none
        }

        @media(max-width:650px) {
            .content {
                padding-top: 30px
            }

            .section-grid {
                grid-template-columns: 1fr
            }

            .rating-row {
                grid-template-columns: 1fr
            }

            .ratings {
                justify-content: space-between
            }

            .rating {
                flex: 1;
                max-width: 70px
            }

            .two-col,
            .role-grid {
                gap: 8px
            }

            .section {
                padding: 15px
            }

            .jumpbar {
                top: 68px
            }

            .topbar {
                padding-left: 12px;
                padding-right: 12px
            }
        }

        @media print {
            @page {
                size: A4;
                margin: 14mm 12mm
            }

            body {
                background: white;
                color: black;
                font-family: Arial, sans-serif;
                font-size: 11pt
            }

            .topbar,
            .jumpbar,
            .no-print,
            .save-status,
            .section summary:after {
                display: none !important
            }

            .content {
                max-width: none;
                padding: 0
            }

            .form-content {
                padding: 0
            }

            .print-header {
                display: flex;
                justify-content: space-between;
                border-bottom: 2px solid #111;
                padding-bottom: 8px;
                margin-bottom: 14px;
                font-size: 12pt
            }

            .section,
            .section.fazit {
                box-shadow: none;
                border: 1px solid #111;
                margin: 0 0 14px;
                padding: 10px;
                break-inside: avoid
            }

            .section:not([open])> :not(summary) {
                display: block
            }

            .section summary {
                font-size: 15pt;
                margin: 0 0 7px
            }

            .rating {
                border: 1px solid #111;
                width: 34px;
                height: 34px;
                font-size: 18px
            }

            .rating.selected {
                background: white;
                box-shadow: none
            }

            .rating.selected:after {
                content: '✓';
                font-size: 18px
            }

            .field input,
            .field textarea {
                border: 0;
                border-bottom: 1px solid #111;
                background: white
            }

            .print-only {
                display: block
            }

            .section-grid {
                grid-template-columns: 1fr 1fr
            }

            .curve {
                min-width: 0
            }

            .curve td {
                height: 30px
            }
        }
    </style>
    <style>
        .jumpbar {
            gap: 22px;
            padding-top: 7px;
            padding-bottom: 7px
        }

        .jumpbar button {
            border: 0;
            background: transparent;
            border-bottom: 3px solid transparent;
            border-radius: 0;
            padding: 8px 2px;
            color: var(--muted);
            font-weight: bold
        }

        .jumpbar button.active {
            background: transparent;
            color: var(--ink);
            border-bottom-color: var(--coral)
        }

        .free-role {
            display: grid;
            grid-template-columns: auto 1fr auto;
            align-items: center;
            gap: 8px
        }

        .free-role input[type=text] {
            min-width: 0
        }
    </style>

    <script>

pty">Noch keine Bewertungen vorhanden. Erstellen Sie die erste Bewertung für einen neuen Assessment-Tag.</div>') + '</div><div class="footer-tools"><button class="button secondary" onclick="exportBackup()">Backup exportieren</button><button class="button secondary" onclick="document.getElementById(\'import-file\').click()">Backup importieren</button><input id="import-file" type="file" accept="application/json" hidden onchange="importBackup(this)"></div><div class="storage-line">Speicher: ' + storageUse() + ' KB belegt</div></main>', false) }

        function openNewDialog() { const today = new Date().toISOString().slice(0, 10); document.getElementById('app').insertAdjacentHTML('beforeend', '<div class="dialog-backdrop"><form class="dialog" onsubmit="createRecord(event)"><h2>Neue Bewertung</h2><div class="field"><label for="first">Vorname *</label><input id="first" required autocapitalize="words" autocorrect="off"></div><div class="field"><label for="last">Nachname *</label><input id="last" required autocapitalize="words" autocorrect="off"></div><div class="field"><label for="date">Datum</label><input id="date" type="date" value="' + today + '"></div><div class="field"><label>Profil</label><div class="segmented">' + ['KV', 'IT', 'FKD'].map((profile, index) => '<label><input type="radio" name="profile" value="' + profile + '" ' + (!index ? 'checked' : '') + '><span>' + profile + '</span></label>').join('') + '</div></div><div class="field"><label for="assessor">Bewerter/in</label><input id="assessor" value="' + esc(localStorage.getItem('assessment:bewerter') || '') + '" autocapitalize="words"></div><div class="dialog-actions"><button type="button" class="button secondary" onclick="render()">Abbrechen</button><button class="button">Erstellen</button></div></form></div>') }

        function renderTrash() { const entries = []; for (let index = 0; index < localStorage.length; index++) { const key = localStorage.key(index); if (key.startsWith('assessment:trash:')) entries.push(readJson(key, null)) } shell('', '<main class="content"><button class="button secondary" onclick="goList()">← Übersicht</button><h1>Papierkorb</h1><p class="intro">Gelöschte Bewertungen bleiben 30 Tage wiederherstellbar.</p><div class="assessment-list">' + (entries.map(entry => '<div class="assessment-row"><div class="row-open"><span class="row-name">' + esc(entry.record.vorname + ' ' + entry.record.nachname) + '</span><span class="row-meta">gelöscht am ' + new Date(entry.deletedAt).toLocaleDateString('de-CH') + '</span></div><div class="row-menu"><button class="button secondary" onclick="restoreRecord(\'' + entry.record.id + '\')">Wiederherstellen</button></div></div>').join('') || '<div class="empty">Der Papierkorb ist leer.</div>') + '</div></main>', false) }
        function restoreRecord(id) { const entry = readJson('assessment:trash:' + id, null); if (!entry) return; saveRecord(entry.record); updateIndex(entry.record); localStorage.removeItem('assessment:trash:' + id); renderTrash() }
        function renderHelp() { shell('', '<main class="content help"><button class="button secondary" onclick="goList()">← Übersicht</button><div class="kicker">Sicherheit & Aufbewahrung</div><h1>Hilfe</h1><p>Die Daten werden ausschliesslich auf diesem iPad gespeichert. Es gibt keine Anmeldung, keinen Server und keine Netzwerkverbindung. Schützen Sie das Gerät mit einem Passcode.</p><h2>Zum Home-Bildschirm hinzufügen</h2><p>Öffnen Sie im Safari-Menü die Teilen-Schaltfläche und wählen Sie <strong>Zum Home-Bildschirm hinzufügen</strong>. Die installierte App öffnet sich ohne Safari-Leiste und wird dauerhafter aufbewahrt.</p><h2>Backups</h2><p>iPadOS kann Webseitendaten nach längerer Nichtverwendung entfernen. Exportieren Sie deshalb mindestens wöchentlich ein Backup und bewahren Sie die unverschlüsselte JSON-Datei geschützt auf.</p><button class="button" onclick="exportBackup()">Backup exportieren</button></main>', false) }
        function renderSettings() { shell('', '<main class="content"><button class="button secondary" onclick="goList()">← Übersicht</button><h1>Einstellungen</h1><p>Alle Daten löschen entfernt Bewertungen, Papierkorb und lokale Einstellungen von diesem iPad.</p><button class="button danger" onclick="deleteAll()">Alle Daten löschen</button></main>', false) }
        function deleteAll() { if (!confirm('Alle Bewertungen und Papierkorb-Daten löschen?')) return; if (!confirm('Bestätigen Sie endgültig: Alle Daten werden jetzt gelöscht.')) return; const keys = []; for (let index = 0; index < localStorage.length; index++) { const key = localStorage.key(index); if (key.startsWith('assessment:')) keys.push(key) } keys.forEach(key => localStorage.removeItem(key)); state.screen = 'list'; render() }
        document.addEventListener('click', event => { if (!event.target.closest('.row-menu')) { state.menuId = null } }); document.addEventListener('input', event => { if (event.target.matches('textarea')) grow(event.target) });
        const lastId = localStorage.getItem(STORAGE_LAST); if (lastId && loadRecord(lastId)) { openRecord(lastId) } else render();
    </script>
